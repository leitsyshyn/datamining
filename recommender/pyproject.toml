[project]
name = "bgg-recsys"
version = "0.1.0"
description = "Collaborative-filtering recommender for BoardGameGeek ratings (data mining lab)"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scikit-surprise>=1.1.5",
    "scipy>=1.16",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.6",
    "papermill>=2.7.0",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgg_recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.jupytext]
formats = "ipynb,py:percent"
